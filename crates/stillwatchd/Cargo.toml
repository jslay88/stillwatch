[package]
name = "stillwatchd"
description = "The Stillwatch daemon: watches for idle input and static screens, then protects OLED panels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# A scriptable DaemonHandle for tests of the D-Bus service and its clients.
fake = []

[dependencies]
anyhow.workspace = true
ashpd = { workspace = true, features = ["screencast"] }
clap.workspace = true
humantime.workspace = true
ddc.workspace = true
ddc-i2c.workspace = true
evdev.workspace = true
futures-util.workspace = true
jiff.workspace = true
notify.workspace = true
pipewire.workspace = true
rustix = { workspace = true, features = ["event", "net"] }
smithay-client-toolkit.workspace = true
stillwatch-core.workspace = true
stillwatch-ipc.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-udev.workspace = true
tracing.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-plasma.workspace = true
zbus.workspace = true

[dev-dependencies]
proptest.workspace = true
stillwatch-core = { workspace = true, features = ["mocks"] }
stillwatch-testkit.workspace = true
stillwatchd = { path = ".", features = ["fake"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
zbus = { workspace = true, features = ["p2p"] }

[lints]
workspace = true
