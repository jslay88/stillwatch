stillwatch-ipc.workspace = true
stillwatchd.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zbus.workspace = true

[dev-dependencies]
stillwatch-core = { workspace = true, features = ["mocks"] }
stillwatch-testkit.workspace = true
stillwatchd = { workspace = true, features = ["fake"] }
