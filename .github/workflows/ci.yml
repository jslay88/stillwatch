name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Every gate goes through `cargo xtask` so CI and `cargo xtask ci` run the same code.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # actions/checkout needs git in the container to produce a real clone.
      - name: Install git
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup

      # Gates after setup run even if an earlier gate failed, so one push reports all of them.
      - name: fmt
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo xtask gate fmt --strict
      - name: clippy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo xtask gate clippy --strict
      - name: check-size
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo xtask check-size
      - name: docs/config.md up to date
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo xtask gen-docs --check
      - name: jscpd
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo xtask gate jscpd --strict
      - name: cargo deny
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo xtask gate deny --strict
      - name: cargo machete
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo xtask gate machete --strict
      - name: build benches
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo xtask gate bench --strict

  test:
    name: test
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # kwin_wayland has the cap_sys_nice file capability; exec fails with EPERM
      # when the container's bounding set lacks it.
      options: --cap-add=SYS_NICE --privileged -v /lib/modules:/lib/modules:ro
    env:
      # Private-bus D-Bus tests fail instead of skipping when dbus-daemon is missing.
      STILLWATCH_REQUIRE_DBUS: "1"
      # Same for the headless kwin_wayland --virtual tests.
      STILLWATCH_REQUIRE_KWIN: "1"
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: probe vgem
        continue-on-error: true
        run: |
          set -x
          uname -r
          pacman -S --noconfirm --needed kmod
          ls /lib/modules/
          find /lib/modules/$(uname -r) -name 'vgem*' -o -name 'vkms*'
          modprobe vgem
          ls -la /sys/class/drm/ /dev/dri || true
          mkdir -p /dev/dri
          for d in /sys/class/drm/card* /sys/class/drm/renderD*; do
            [ -e "$d/dev" ] || continue
            IFS=: read -r major minor < "$d/dev"
            [ -e "/dev/dri/$(basename "$d")" ] || mknod -m 666 "/dev/dri/$(basename "$d")" c "$major" "$minor"
          done
          ls -la /dev/dri
          cat /sys/class/drm/*/device/uevent 2>/dev/null || true

      - name: Tests and coverage thresholds
        run: cargo xtask coverage
      - name: Upload lcov
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: target/coverage/lcov.info
          if-no-files-found: warn
