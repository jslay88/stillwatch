# cargo-deny configuration, run by `cargo xtask ci` and CI.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses plus LGPL. Anything else needs an explicit exception.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MIT",
    "MPL-2.0",
    "Zlib",
]
confidence-threshold = 0.8
# The allowlist is a policy, not an inventory of what is in the tree today.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
# Workspace crates are `publish = false`.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
